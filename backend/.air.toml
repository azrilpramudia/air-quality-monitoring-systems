root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true